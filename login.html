<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Masuk | GIMA Analytics</title>
<link rel="stylesheet" href="/assets/css/base.css"><link rel="stylesheet" href="/assets/css/auth.css?v=20261015-login">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#103f3c"></head>
<body class="gima-login-body">
<main class="gima-login-page">
  <div class="gima-login-decoration gima-login-decoration-left" aria-hidden="true"></div>
  <div class="gima-login-decoration gima-login-decoration-right" aria-hidden="true"></div>
  <section class="gima-login-card" aria-labelledby="login-title">
    <a class="gima-login-brand" href="/" aria-label="GIMA Analytics - Beranda">
      <img src="/assets/giandra-maheswara-logo.svg" alt="Logo Giandra Maheswara">
      <span><strong>GIANDRA<br>MAHESWARA</strong><small>GIMA Analytics</small></span>
    </a>
    <h1 id="login-title">Masuk ke GIMA Analytics</h1>
    <p class="gima-login-subtitle">Satu akun untuk mengelola survei dan memahami data organisasi Anda.</p>
    <form id="login-form" class="gima-login-form">
      <label for="login-email">Email</label>
      <input id="login-email" name="email" type="email" autocomplete="username" placeholder="nama@perusahaan.com" required maxlength="254">
      <label for="login-password">Kata sandi</label>
      <div class="gima-password-field">
        <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan kata sandi" required minlength="8">
        <button id="toggle-password" type="button" aria-label="Tampilkan password" aria-pressed="false">Lihat</button>
      </div>
      <div class="gima-login-options"><span class="gima-login-help">Lupa kata sandi? <a href="mailto:halo@giandramaheswara.com?subject=Bantuan%20Akses%20GIMA%20Analytics">Hubungi pengelola</a></span></div>
      <button class="gima-login-submit" id="login-submit" type="submit">Masuk</button>
      <p id="login-status" role="status" aria-live="polite" class="auth-note"></p>
    </form>
    <p class="gima-access-note">Anda akan diarahkan ke panel sesuai hak akses akun.</p>
    <button id="gima-install" class="gima-login-submit" type="button" hidden>Instal GIMA Analytics</button>
    <p class="gima-login-contact">Belum punya akun? <a href="/#contact">Hubungi Kami</a></p>
  </section>
  <a class="gima-login-back" href="/">← Kembali ke Beranda</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js" defer></script>
<script src="/assets/js/supabase-config.js" defer></script>
<script src="/assets/js/auth-client.js" defer></script>
<script src="/assets/js/login.js" defer></script>
<script src="/assets/js/install-app.js" defer></script></body></html>
